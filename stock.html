<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>วิเคราะห์หุ้น US — Claudy Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:       #0E0D0C;
  --s1:       #161412;
  --s2:       #1E1B19;
  --s3:       #272320;
  --s4:       #312D29;
  --border:   #3A3530;
  --border2:  #4D4742;
  --orange:   #E8721A;
  --orange-d: rgba(232,114,26,.12);
  --orange-g: rgba(232,114,26,.22);
  --text:     #F0EAE3;
  --text2:    #A39890;
  --text3:    #5C5650;
  --green:    #4ade80;
  --amber:    #fbbf24;
  --red:      #f87171;
  --radius:   10px;
  --radius-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline;opacity:.85}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.04em;white-space:nowrap}
.chip-buy{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.chip-hold{background:rgba(251,191,36,.12);color:#fbbf24;border:1px solid rgba(251,191,36,.25)}
.chip-sell{background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.25)}
.chip-orange{background:var(--orange-d);color:var(--orange);border:1px solid var(--orange-g)}
.chip-gray{background:var(--s3);color:var(--text2);border:1px solid var(--border)}

.top-bar{background:var(--s1);border-bottom:1px solid var(--border);padding:0 32px;height:52px;display:flex;align-items:center;gap:16px}
.logo{font-size:1.1rem;font-weight:700;color:var(--text);letter-spacing:-.01em}
.logo b{color:var(--orange)}
.top-bar-right{margin-left:auto;display:flex;gap:6px}
.nav-chip{padding:5px 14px;border-radius:6px;font-size:.82rem;font-weight:600;color:var(--text2);border:1px solid transparent;transition:all .15s;cursor:pointer}
.nav-chip:hover{background:var(--s3);color:var(--text);text-decoration:none}
.nav-chip.active{background:var(--orange-d);color:var(--orange);border-color:var(--orange-g)}
.stats-row{background:var(--s2);border-bottom:1px solid var(--border);padding:12px 32px;display:flex;gap:32px}
.stat{display:flex;align-items:baseline;gap:7px}
.stat-n{font-size:1.35rem;font-weight:700;color:var(--orange);font-family:'JetBrains Mono',monospace;line-height:1}
.stat-l{font-size:.72rem;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
.main{max-width:1120px;margin:0 auto;padding:36px 32px 80px}
.sec{margin:0 0 44px}
.sec-hd{font-size:.68rem;font-weight:700;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.grid-wide{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;transition:all .15s;text-decoration:none;display:block;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--orange);opacity:0;transition:opacity .15s}
.card:hover{border-color:var(--border2);background:var(--s2);transform:translateY(-1px);text-decoration:none}
.card:hover::before{opacity:1}
.card-dt{font-size:.92rem;font-weight:700;color:var(--text);font-family:'JetBrains Mono',monospace;margin:0 0 3px}
.card-sub{font-size:.75rem;color:var(--text3);margin:0 0 10px}
.card-dots{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--orange)}
.dot-off{background:var(--s4)}
.card-title{font-size:.9rem;font-weight:600;color:var(--text);margin:0 0 4px;line-height:1.35}
.card-meta{font-size:.75rem;color:var(--text3)}
.wl-table{width:100%;border-collapse:collapse}
.wl-table th{background:var(--s2);color:var(--text3);padding:9px 16px;text-align:left;border-bottom:1px solid var(--border);font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.wl-table td{padding:10px 16px;border-bottom:1px solid var(--s2);vertical-align:middle;font-size:.88rem}
.wl-table tr:last-child td{border-bottom:none}
.wl-table tr:hover td{background:var(--s1)}
.ticker{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);font-size:.92rem}
.src-link{color:var(--text2);font-size:.8rem}
.src-link:hover{color:var(--orange)}
.empty{color:var(--text3);font-size:.85rem;padding:16px 0}
.foot{text-align:center;color:var(--text3);font-size:.75rem;padding:20px 32px;border-top:1px solid var(--border);margin-top:40px}
@media(max-width:640px){
  .top-bar{padding:0 16px}.stats-row{padding:10px 16px;gap:20px}
  .main{padding:24px 16px 60px}.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}

.top-bar{background:var(--s1);border-bottom:1px solid var(--border);padding:0 24px;height:52px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.logo{font-size:1rem;font-weight:700;color:var(--text)}
.logo b{color:var(--orange)}
.back-btn{background:var(--s3);color:var(--text2);border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-family:'Sarabun',sans-serif;font-size:.8rem;transition:all .15s;text-decoration:none;display:inline-block}
.back-btn:hover{background:var(--s4);color:var(--text);text-decoration:none}
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo">Claudy <b>Research</b></div>
  <a class="back-btn" href="index.html">← คลัง</a>

</div>
<div class="main">

    </a><a class="card" href="stock-MU-2026-05-13.html" style="text-decoration:none">
      <div class="card-dt" style="font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700">MU</div>
      <div class="card-sub">2026-05-13</div>
      <div class="card-title" style="margin-top:8px;font-size:.85rem">Micron Technology, Inc.</div>

    </a></div>
  </div>
</div>
<div class="foot">Claudy Research · วิเคราะห์โดย 8 Personas · ข้อมูลจาก Yahoo Finance + Web Research</div>
</body>
